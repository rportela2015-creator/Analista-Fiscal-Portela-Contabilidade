<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Filtro sutil para realce clássico -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Camada 1: Monograma Entrelaçado "C" e "P" Clássico Serifado -->
  <g class="monogram" filter="url(#subtle-shadow)">
    <!-- Letra "C" em Verde-Claro #5B7B35 -->
    <path d="M 172 38 C 168 31 160 26 148 26 C 131 26 116 39 116 58 C 116 78 131 90 149 90 C 161 90 169 85 174 78 L 165 72 C 161 77 155 81 148 81 C 137 81 127 72 127 58 C 127 44 137 35 148 35 C 156 35 162 39 165 44 Z" 
          fill="#5B7B35" />
    
    <!-- Letra "P" em Verde-Escuro #3A4A1E (Haste vertical e bojo entrelaçado) -->
    <path d="M 148 30 L 170 30 C 182 30 191 37 191 48 C 191 59 182 66 170 66 L 157 66 L 157 88 L 148 88 Z M 157 37 L 157 59 L 169 59 C 176 59 181 55 181 48 C 181 41 176 37 169 37 Z" 
          fill="#3A4A1E" opacity="0.95" />
  </g>

  <!-- Camada 2: Textos Tipográficos Institucionais -->
  <!-- "C O N T A B I L I D A D E" espaçado em #5B7B35 -->
  <text x="160" y="112" 
        text-anchor="middle" 
        fill="#5B7B35" 
        font-family="'EB Garamond', Georgia, 'Times New Roman', serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="0.32em">CONTABILIDADE</text>

  <!-- "PORTELA" em destaque serifado clássico #3A4A1E -->
  <text x="160" y="140" 
        text-anchor="middle" 
        fill="#3A4A1E" 
        font-family="'EB Garamond', Georgia, 'Times New Roman', serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="0.08em">PORTELA</text>

  <!-- Camada 3: Base "DESDE 1970" com filetes horizontais verdes #5B7B35 -->
  <g class="footer-badge">
    <!-- Filete Esquerdo -->
    <line x1="42" y1="158" x2="114" y2="158" stroke="#5B7B35" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Texto Central -->
    <text x="160" y="161.5" 
          text-anchor="middle" 
          fill="#5B7B35" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="8.5" 
          font-weight="600" 
          letter-spacing="0.22em">DESDE 1970</text>
          
    <!-- Filete Direito -->
    <line x1="206" y1="158" x2="278" y2="158" stroke="#5B7B35" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
